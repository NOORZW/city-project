<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
<title>Flappy</title>
<style>
    html, body { margin: 0; height: 100%; background: #1d2b36; display: flex; align-items: center; justify-content: center; }
    canvas { max-height: 100vh; max-width: 100vw; aspect-ratio: 480 / 640; touch-action: none; border-radius: 8px; box-shadow: 0 8px 40px #0008; }
</style>
<head>
<body>
<canvas id="c"></canvas>
<script>
// Flappy: Space / Up / W / click / tap to flap, P pause, R restart, M mute.
const W = 480, H = 640, GROUND = 90, PLAY_H = H - GROUND;
const GAP = 165, PIPE_W = 72, SPACING = 230, CAP_H = 26, CAP_X = 5;
const SPEED = 170, GRAVITY = 1500, FLAP = -440, MAX_FALL = 650;
const BIRD_X = 120, BIRD_R = 14;
const GREEN = "#73bf2e", GREEN_D = "#4d8a1c", GREEN_L = "#a6e060";

const cv = document. getElementById("c"), ctx = cv.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H *dpr;
ctx.scale(dpr, dpr);

let best = 0;
try { best = +localStorage.getItem("flappy_best") || 0; } catch (e) {}

// ---------- tiny sound effects (WebAudio, no files) ----------
let audio = null, muted = false;
function beep(freq, dur, type = "square", vol = 0.06, slide = 0) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---------- state ----------
let s, scroll = 0, paused = false, last = performance.now();
const clouds = Array.from({ length: 6 }, () => ({ x: Math.random() * W, y: 40 + Math.random() * 260, s: 0.7 + Math.random() * 0.7 }));

function reset() {
  s = { state: "ready", y: PLAY_H / 2, vy: 0, pipes: [], score: 0, t: 0, flash: 0, shake: 0,
        parts: [], newBest: false, deadAt: 0 };
}
reset();

function flap() {
  if (paused) return;
  if (s.state === "ready") s.state = "play";
  if (s.state === "play") {
    s.vy = FLAP;
    beep(520, 0.12, "square", 0.05, 380);
    for (let i = 0; i < 4; i++)
      s.parts.push({ x: BIRD_X - 10, y: s.y + 6, vx: -90 + Math.random() * 60, vy: 10 + Math.random() * 70, life: 0.35 });
  } else if (s.state === "dead") restart();
}

function drawHud() {
  if (s.state !== "ready") text(s.score, W / 2, 60, 44, "#fff", "center", true);
  if (s.state === "ready") {
    text("FLAPPY", W / 2, 170, 46, "#fff", "center", true);
    text("Press SPACE, click or tap to flap", W / 2, 215, 16, "#fff", "center", true);
    text("Best: " + best, W / 2, 242, 14, "#fff", "center", true);
  }
  if (paused) {
    ctx.fillStyle = "#0008"; ctx.fillRect(0, 0, W, H);
    text("PAUSED", W / 2, H / 2, 36, "#fff");
  }
  if (s.state === "dead") {
    const x0 = 70, y0 = 180, x1 = W - 70, y1 = 400;
    rect(x0 + 4, y0 + 4, x1 - x0, y1 - y0, "#3a3a3a");
    rect(x0, y0, x1 - x0, y1 - y0, "#f7ecb5", "#5a4a1a", 4);
    text("GAME OVER", W / 2, y0 + 38, 30, "#e0541e");
    const medal = s.score >= 20 ? "#ffd700" : s.score >= 10 ? "#c0c0c0" : s.score >= 5 ? "#cd7f32" : null;
    ellipse(x0 + 60, y0 + 115, 35, 35, medal || "#d8cf9b", "#5a4a1a", 3);
    if (medal) text("★", x0 + 60, y0 + 116, 30, "#fff");
    text("SCORE", x1 - 25, y0 + 92, 11, "#a0602a", "right");
    text(s.score, x1 - 25, y0 + 116, 26, "#333", "right");
    text("BEST " + best + (s.newBest ? "  NEW!" : ""), x1 - 25, y0 + 144, 12, s.newBest ? "#e0541e" : "#a0602a", "right");
    text("R / SPACE: play again", W / 2, y1 - 28, 12, "#5a4a1a");
  }
}

function render() {
  ctx.save();
   if (s.shake) ctx.translate((Math.random() - .5) * s.shake * 48, (Math.random() - .5) * s.shake * 48);
  drawSky();
  s.pipes.forEach(drawPipe);
  drawGround();
  for (const p of s.parts) ellipse(p.x, p.y, 2 + p.life * 6, 2 + p.life * 6, "#fff3a0");
  drawBird();
  ctx.restore();
  if (s.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${s.flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  drawHud();
}

function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (!paused) step(dt);
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- input ----------
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ([" ", "arrowup", "w"].includes(k)) { e.preventDefault(); if (!e.repeat) flap(); }
  else if (k === "p") togglePause();
  else if (k === "r") restart();
  else if (k === "m") muted = !muted;
});
cv.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
addEventListener("blur", () => { if (s.state === "play") paused = true; });
</script>
</body>
</html>
